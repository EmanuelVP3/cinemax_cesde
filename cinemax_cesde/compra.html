<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comprar Tickets - CineMax CESDE</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- Cabecera con Bootstrap -->
    <header class="text-white text-center py-4">
      <h1 class="display-4 fw-bold logo-cinemax">
        <span style="--i:0">🎬</span>&nbsp;<span style="--i:1">C</span><span style="--i:2">i</span><span style="--i:3">n</span><span style="--i:4">e</span><span style="--i:5">M</span><span style="--i:6">a</span><span style="--i:7">x</span>&nbsp;<span style="--i:8">C</span><span style="--i:9">E</span><span style="--i:10">S</span><span style="--i:11">D</span><span style="--i:12">E</span>
      </h1>
      <p class="lead mb-3">Tu cine favorito - Vive la experiencia en grande</p>
      <div class="d-flex gap-2 justify-content-center">
            <a href="login.html#login" class="btn-auth">Iniciar sesión</a>
            <a href="login.html#registro" class="btn-auth">Registrarse</a>
          </div>
    </header>

    <!-- Nueva Barra de Navegación Transparente -->
    <nav class="navbar navbar-expand-lg sticky-top shadow-lg" style="background: rgba(10, 10, 18, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid rgba(231, 76, 60, 0.2); z-index: 1050;">
      <div class="container">
        <!-- Título pequeño que solo aparece en celulares -->
        <a class="navbar-brand text-white fw-bold d-lg-none" href="index.html">🎬 CineMax</a>
        
        <!-- Botón de hamburguesa para móviles -->
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon" style="filter: invert(1) sepia(1) saturate(5) hue-rotate(300deg);"></span>
        </button>
        
        <!-- Contenido de la barra (Enlaces) -->
        <div class="collapse navbar-collapse justify-content-center" id="menuNavegacion">
          <ul class="navbar-nav gap-2 text-center mt-3 mt-lg-0 p-2 p-lg-0 rounded-4" style="background: rgba(0,0,0,0.2);">
            <li class="nav-item">
              <a class="nav-link text-white rounded-pill px-4 hover-nav" href="index.html">Cartelera</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active rounded-pill px-4 fw-bold nav-neon-active" href="compra.html">Comprar Tickets</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white rounded-pill px-4 hover-nav" href="multimedia.html">Multimedia</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white rounded-pill px-4 hover-nav" href="contacto.html">Contáctanos</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main>
      <section id="compra">
        <h2>🎟️ Formulario de Compra de Tickets</h2>
        <!-- Formulario con clases de Bootstrap -->
        <form action="">
          <!-- mb-3 = margin-bottom 3 (espaciado entre campos) -->
          <div class="mb-3">
            <!-- form-label = estilo Bootstrap para etiquetas -->
            <label for="nombreCliente" class="form-label">Nombre del Cliente:</label>
            <!-- form-control = estilo Bootstrap para inputs (bordes redondeados, tamaño uniforme) -->
            <input
              type="text"
              class="form-control"
              id="nombreCliente"
              name="nombreCliente"
              placeholder="Ej: Juan Pérez"
            />
          </div>
          <div class="mb-3">
            <label for="tituloPelicula" class="form-label">Película:</label>
            <!-- form-select = estilo Bootstrap para <select> -->
            <select class="form-select" id="tituloPelicula" name="tituloPelicula">
              <option value="">-- Elige una película --</option>
              <option value="dune2">Dune: Parte 2 — $22.000</option>
              <option value="godzilla">Godzilla vs. Kong — $22.000</option>
              <option value="insideout2">Inside Out 2 — $15.000</option>
              <option value="oppenheimer">Oppenheimer — $19.000</option>
              <option value="lotr">El Señor de los Anillos — $19.000</option>
              <option value="deadpool">Deadpool & Wolverine — $20.000</option>
              <option value="spiderman">Spider-Man: No Way Home — $21.000</option>
              <option value="batman">The Batman — $19.000</option>
              <option value="avatar">Avatar: El Camino del Agua — $23.000</option>
              <option value="avengers">Avengers: Endgame — $25.000</option>
              <option value="joker">Joker — $18.000</option>
              <option value="interstellar">Interstellar — $18.000</option>
              <option value="matrix">The Matrix — $17.000</option>
              <option value="inception">Inception — $21.000</option>
              <option value="gladiator">Gladiator — $20.000</option>
              <option value="croods">Los Croods — $15.000</option>
              <option value="killbill">Kill Bill — $19.000</option>
              <option value="lionking">El Rey León — $14.000</option>
              <option value="titanic">Titanic — $18.000</option>
              <option value="jurassic">Jurassic Park — $16.000</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="cantidadTickets" class="form-label">Cantidad de Tickets:</label>
            <input
              type="number"
              class="form-control"
              id="cantidadTickets"
              name="cantidadTickets"
              min="1"
              max="10"
              placeholder="1"
            />
          </div>
          <div class="mb-3">
            <label for="edadComprador" class="form-label">Edad del Comprador:</label>
            <input
              type="number"
              class="form-control"
              id="edadComprador"
              name="edadComprador"
              min="1"
              max="120"
              placeholder="Ej: 22"
            />
          </div>
          <div class="d-grid">
            <!-- d-grid = hace que el botón ocupe todo el ancho -->
            <button type="submit" class="btn btn-danger rounded-pill fw-bold">Procesar Compra</button>
          </div>
        </form>
      </section>
    </main>
    <footer>
      <p>
        &copy; 2026 CineMax CESDE - Introducción a la Programación &nbsp;|&nbsp;
        Todos los derechos reservados
      </p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
