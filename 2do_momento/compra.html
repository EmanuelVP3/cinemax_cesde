<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comprar Tickets - CineMax CESDE</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>🎬 CineMax CESDE</h1>
      <p>Tu cine favorito - Vive la experiencia en grande</p>
      <a href="login.html#login">Iniciar sesión</a> &nbsp;|&nbsp;
      <a href="login.html#registro">Registrarse</a>
    </header>
    <nav>
      <a href="index.html">Cartelera</a>
      <a href="compra.html" class="active">Comprar Tickets</a>
      <a href="multimedia.html">Multimedia</a>
      <a href="contacto.html">Contáctanos</a>
    </nav>
    <main>
      <section id="compra">
        <h2>🎟️ Formulario de Compra de Tickets</h2>
        <form action="">
          <p>
            <label for="nombreCliente">Nombre del Cliente:</label>
            <input type="text" id="nombreCliente" name="nombreCliente" placeholder="Ej: Juan Pérez" />
          </p>
          <p>
            <label for="tituloPelicula">Título de la Película:</label>
            <input type="text" id="tituloPelicula" name="tituloPelicula" placeholder="Ej: Interstellar" />
          </p>
          <p>
            <label for="cantidadTickets">Cantidad de Tickets:</label>
            <input type="number" id="cantidadTickets" name="cantidadTickets" min="1" max="10" placeholder="1" />
          </p>
          <p>
            <label for="edadComprador">Edad del Comprador:</label>
            <input type="number" id="edadComprador" name="edadComprador" min="1" max="120" placeholder="Ej: 22" />
          </p>
          <p>
            <button type="submit">Procesar Compra</button>
          </p>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 CineMax CESDE - Introducción a la Programación &nbsp;|&nbsp; Todos los derechos reservados</p>
    </footer>
  </body>
</html>
