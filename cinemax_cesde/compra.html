<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comprar Tickets - CineMax CESDE</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- Nueva Barra de Navegación Transparente (Estilo Top-Bar unificado) -->
    <nav class="navbar navbar-expand-lg sticky-top shadow-lg" style="background: rgba(10, 10, 18, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid rgba(231, 76, 60, 0.2); z-index: 1050;">
      <div class="container">
        <!-- Logo a la izquierda -->
        <a class="navbar-brand text-white fw-bold" href="index.html" style="width: 250px;">🎬 CineMax <span class="text-danger">CESDE</span></a>
        
        <!-- Botón de hamburguesa para móviles -->
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon" style="filter: invert(1) sepia(1) saturate(5) hue-rotate(300deg);"></span>
        </button>
        
        <!-- Contenido de la barra -->
        <div class="collapse navbar-collapse" id="menuNavegacion">
          
          <!-- Enlaces centrados perfectamente con mx-auto -->
          <ul class="navbar-nav mx-auto gap-3 text-center">
            <li class="nav-item">
              <a class="nav-link btn-auth text-white text-nowrap" href="index.html">Cartelera</a>
            </li>
            <!-- Botón 'Comprar Tickets' removido del navbar por petición del usuario -->
            <li class="nav-item">
              <a class="nav-link btn-auth text-white text-nowrap" href="multimedia.html">Multimedia</a>
            </li>
            <li class="nav-item">
              <a class="nav-link btn-auth text-white text-nowrap" href="contacto.html">Contáctanos</a>
            </li>
          </ul>
          
          <!-- Botón unificado de sesión (Ancho fijo para balance) a la derecha -->
          <div class="d-flex mt-3 mt-lg-0 justify-content-center justify-content-lg-end mx-auto mx-lg-0" style="width: 250px;">
            <div class="btn-auth d-flex align-items-center p-0 overflow-hidden text-nowrap" style="border-radius: 50px; border-width: 1px; box-shadow: 0 0 10px rgba(255, 107, 107, 0.4);">
              <a href="login.html#login" class="text-white text-decoration-none px-2 py-1" style="font-size: 0.75rem; border-right: 1px solid rgba(231, 76, 60, 0.4);">Iniciar sesión</a>
              <a href="login.html#registro" class="text-white text-decoration-none px-2 py-1" style="font-size: 0.75rem;">Registrarse</a>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <main>
      <section id="compra" class="container mt-2 mb-3 w-100">
        <div class="row g-4 align-items-center">
          
          <!-- Columna Izquierda: Logo CineMax -->
          <div class="col-md-6 d-none d-md-block text-center">
            <h1 class="display-2 fw-bold logo-cinemax mb-4">
              <span style="--i:0">🎬</span><br>
              <span style="--i:1">C</span><span style="--i:2">i</span><span style="--i:3">n</span><span style="--i:4">e</span><span style="--i:5">M</span><span style="--i:6">a</span><span style="--i:7">x</span><br>
              <span class="text-danger" style="--i:8">C</span><span class="text-danger" style="--i:9">E</span><span class="text-danger" style="--i:10">S</span><span class="text-danger" style="--i:11">D</span><span class="text-danger" style="--i:12">E</span>
            </h1>
            <p class="lead text-white-50 mt-4">Tu cine favorito - Vive la experiencia en grande</p>
          </div>

          <!-- Columna Derecha: Formulario -->
          <div class="col-md-6">
            <div class="bg-glass-card p-4 rounded-4">
              <h3 class="text-center mb-4 text-white">🎟️ Compra de Tickets</h3>
              <form action="">
                <div class="mb-3">
                  <label for="nombreCliente" class="form-label text-white">Nombre del Cliente:</label>
                  <input type="text" class="form-control" id="nombreCliente" name="nombreCliente" placeholder="Ej: Juan Pérez" />
                </div>
                <div class="mb-3">
                  <label for="tituloPelicula" class="form-label text-white">Película:</label>
                  <select class="form-select" id="tituloPelicula" name="tituloPelicula">
                    <option value="">-- Elige una película --</option>
                    <option value="dune2">Dune: Parte 2 — $22.000</option>
                    <option value="godzilla">Godzilla vs. Kong — $22.000</option>
                    <option value="insideout2">Inside Out 2 — $15.000</option>
                    <option value="oppenheimer">Oppenheimer — $19.000</option>
                    <option value="lotr">El Señor de los Anillos — $19.000</option>
                    <option value="deadpool">Deadpool & Wolverine — $20.000</option>
                    <option value="spiderman">Spider-Man: No Way Home — $21.000</option>
                    <option value="batman">The Batman — $19.000</option>
                    <option value="avatar">Avatar: El Camino del Agua — $23.000</option>
                    <option value="avengers">Avengers: Endgame — $25.000</option>
                    <option value="joker">Joker — $18.000</option>
                    <option value="interstellar">Interstellar — $18.000</option>
                    <option value="matrix">The Matrix — $17.000</option>
                    <option value="inception">Inception — $21.000</option>
                    <option value="gladiator">Gladiator — $20.000</option>
                    <option value="croods">Los Croods — $15.000</option>
                    <option value="killbill">Kill Bill — $19.000</option>
                    <option value="lionking">El Rey León — $14.000</option>
                    <option value="titanic">Titanic — $18.000</option>
                    <option value="jurassic">Jurassic Park — $16.000</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="cantidadTickets" class="form-label text-white">Cantidad de Tickets:</label>
                  <input type="number" class="form-control" id="cantidadTickets" name="cantidadTickets" min="1" max="10" placeholder="1" />
                </div>
                <div class="mb-4">
                  <label for="edadComprador" class="form-label text-white">Edad del Comprador:</label>
                  <input type="number" class="form-control" id="edadComprador" name="edadComprador" min="1" max="120" placeholder="Ej: 22" />
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn btn-danger rounded-pill fw-bold">Procesar Compra</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <p>
        &copy; 2026 CineMax CESDE - Introducción a la Programación &nbsp;|&nbsp; Dev: 
        <a href="https://github.com/EmanuelVP3" target="_blank" class="text-danger text-decoration-none fw-bold">Emanuel VP</a> &nbsp;|&nbsp;
        Todos los derechos reservados
      </p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
