<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comprar Tickets - CineMax CESDE</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- Cabecera con Bootstrap -->
    <header class="text-white text-center py-4">
      <h1 class="display-4 fw-bold">🎬 CineMax CESDE</h1>
      <p class="lead mb-3">Tu cine favorito - Vive la experiencia en grande</p>
      <div class="d-flex justify-content-center gap-2">
        <a href="login.html#login" class="btn-ingresar">Iniciar sesión</a>
        <a href="login.html#registro" class="btn-registro">Registrarse</a>
      </div>
    </header>

    <nav class="py-3 shadow-sm">
      <div class="container d-flex justify-content-center">
        <ul class="nav nav-pills gap-2 flex-wrap justify-content-center">
          <li class="nav-item">
            <a class="nav-link text-white rounded-pill px-4" href="index.html">Cartelera</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active rounded-pill px-4" href="compra.html">Comprar Tickets</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white rounded-pill px-4" href="multimedia.html">Multimedia</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white rounded-pill px-4" href="contacto.html">Contáctanos</a>
          </li>
        </ul>
      </div>
    </nav>
    <main>
      <section id="compra">
        <h2>🎟️ Formulario de Compra de Tickets</h2>
        <form action="">
          <p>
            <label for="nombreCliente">Nombre del Cliente:</label>
            <input
              type="text"
              id="nombreCliente"
              name="nombreCliente"
              placeholder="Ej: Juan Pérez"
            />
          </p>
          <p>
            <label for="tituloPelicula">Película:</label>
            <select id="tituloPelicula" name="tituloPelicula">
              <option value="">-- Elige una película --</option>
              <option value="dune2">Dune: Parte 2 — $22.000</option>
              <option value="godzilla">Godzilla vs. Kong — $22.000</option>
              <option value="insideout2">Inside Out 2 — $15.000</option>
              <option value="oppenheimer">Oppenheimer — $19.000</option>
              <option value="lotr">El Señor de los Anillos — $19.000</option>
            </select>
          </p>
          <p>
            <label for="cantidadTickets">Cantidad de Tickets:</label>
            <input
              type="number"
              id="cantidadTickets"
              name="cantidadTickets"
              min="1"
              max="10"
              placeholder="1"
            />
          </p>
          <p>
            <label for="edadComprador">Edad del Comprador:</label>
            <input
              type="number"
              id="edadComprador"
              name="edadComprador"
              min="1"
              max="120"
              placeholder="Ej: 22"
            />
          </p>
          <p>
            <button type="submit">Procesar Compra</button>
          </p>
        </form>
      </section>
    </main>
    <footer>
      <p>
        &copy; 2026 CineMax CESDE - Introducción a la Programación &nbsp;|&nbsp;
        Todos los derechos reservados
      </p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
